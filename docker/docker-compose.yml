# ===========================================
# EXO Cluster Manager Docker Compose
# ===========================================
# 使用方法:
#   cd docker && docker compose up -d
#   查看日志: docker compose logs -f
#   停止服务: docker compose down
#   重建镜像: docker compose up -d --build
# ===========================================

services:
  exo-manager:
    build:
      # 构建上下文指向项目根目录 (因为需要访问所有源码)
      context: ../
      dockerfile: docker/Dockerfile
    image: exo-manager:latest
    container_name: exo-manager

    # 端口映射: 主机端口:容器端口
    ports:
      - "18080:8080"          # Web UI
      - "10007:10007"         # FRP Server 控制端口
      - "30000-50000:30000-50000/tcp"  # FRP 动态 TCP 代理端口范围

    # 网络模式: bridge (默认)
    # network_mode: host

    # 环境变量配置 (可通过 .env 文件覆盖)
    environment:
      # 运行环境
      - EXO_ENV=${EXO_ENV:-development}
      - EXO_PORT=8080

      # 安全配置
      - EXO_FORCE_HTTPS=${EXO_FORCE_HTTPS:-false}
      - EXO_DEV_MODE=${EXO_DEV_MODE:-false}
      - EXO_CORS_ORIGINS=${EXO_CORS_ORIGINS:-http://localhost:8080}

      # 管理员密码 (生产环境必须修改!)
      - EXO_ADMIN_DEFAULT_PASSWORD=${EXO_ADMIN_DEFAULT_PASSWORD:-}
      - EXO_INIT_PASSWORD=${EXO_INIT_PASSWORD:-admin_init_2024!}

      # 数据加密密钥 (生产环境必须设置!)
      - EXO_ENCRYPTION_KEY=${EXO_ENCRYPTION_KEY:-}

      # 日志配置
      - EXO_LOG_LEVEL=${EXO_LOG_LEVEL:-INFO}

      # 速率限制
      - EXO_RATE_LIMIT_ENABLED=${EXO_RATE_LIMIT_ENABLED:-true}
      - EXO_RATE_LIMIT_REQUESTS=${EXO_RATE_LIMIT_REQUESTS:-100}
      - EXO_RATE_LIMIT_WINDOW=${EXO_RATE_LIMIT_WINDOW:-60}

      # IP 过滤 (默认关闭)
      - EXO_IP_FILTER_ENABLED=${EXO_IP_FILTER_ENABLED:-false}
      - EXO_IP_WHITELIST=${EXO_IP_WHITELIST:-}
      - EXO_IP_BLACKLIST=${EXO_IP_BLACKLIST:-}

      # 审计日志
      - EXO_AUDIT_ENABLED=${EXO_AUDIT_ENABLED:-true}

      # 调试模式 (生产必须关闭!)
      - EXO_DEBUG=${EXO_DEBUG:-false}

      # FRP Server 配置 (内网穿透)
      - EXO_FRP_ENABLE=true
      - EXO_FRP_BIND_PORT=10007
      - EXO_FRP_TOKEN=${EXO_FRP_TOKEN:-}
      - EXO_FRP_DASHBOARD_PORT=${EXO_FRP_DASHBOARD_PORT:-0}

    # 数据卷挂载 (持久化数据)
    volumes:
      # 绑定挂载本地 data 目录（本地修改实时同步到容器）
      - ../data:/app/data
      # 绑定挂载本地 logs 目录，日志文件可直接在 f:\exoProject\exo_manager\logs 查看
      - ../logs:/app/logs
      # 可选: 挂载自定义配置文件
      # - ./config:/app/config:ro

    # 重启策略
    restart: unless-stopped

    # 资源限制 (可选, 根据实际情况调整)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/cluster/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 日志配置
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"


