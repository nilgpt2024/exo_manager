<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXO - 用户登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.75);
            --accent-cyan: #00f5d4;
            --accent-blue: #00bbf9;
            --accent-purple: #9b5de5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-glow: rgba(0, 245, 212, 0.15);
            --gradient-main: linear-gradient(135deg, #00f5d4 0%, #00bbf9 50%, #9b5de5 100%);
            --gradient-btn: linear-gradient(135deg, #00f5d4 0%, #00bbf9 100%);
            --error: #ef4444;
            --error-glow: rgba(239, 68, 68, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        /* ===== 背景层 ===== */
        .grid-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 245, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 212, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
            animation: orbFloat 18s ease-in-out infinite;
        }

        .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--accent-cyan), transparent); top: -180px; right: -150px; }
        .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, var(--accent-purple), transparent); bottom: -120px; left: -120px; animation-delay: -8s; }
        .orb-3 { width: 250px; height: 250px; background: radial-gradient(circle, var(--accent-blue), transparent); top: 40%; left: 10%; animation-delay: -4s; opacity: 0.2; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 25px) scale(0.95); }
        }

        /* ===== 登录卡片 ===== */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: cardEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 245, 212, 0.12);
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 25px 80px rgba(0,0,0,0.5),
                0 0 60px rgba(0, 245, 212, 0.06);
        }

        /* 卡片顶部 */
        .card-header {
            padding: 2.8rem 2.4rem 1.8rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 200px;
            background: linear-gradient(180deg, rgba(0, 245, 212, 0.06) 0%, transparent 100%);
            pointer-events: none;
        }

        .brand-icon {
            width: 72px; height: 72px;
            background: var(--gradient-main);
            border-radius: 20px;
            display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 30px;
            color: var(--bg-primary);
            margin-bottom: 1.2rem;
            box-shadow: 0 12px 32px rgba(0, 245, 212, 0.25);
            position: relative;
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 12px 32px rgba(0, 245, 212, 0.25); }
            50% { box-shadow: 0 12px 40px rgba(0, 245, 212, 0.35), 0 0 60px rgba(0, 187, 249, 0.15); }
        }

        .card-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            position: relative;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 300;
            position: relative;
        }

        /* 表单区域 */
        .form-panel {
            padding: 0 2.4rem 2.4rem;
            animation: panelIn 0.35s ease;
        }

        @keyframes panelIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group { margin-bottom: 1.2rem; }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 0.82rem 16px 0.82rem 46px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 13px;
            font-size: 0.93rem;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: all 0.28s ease;
        }

        .form-input::placeholder { color: var(--text-muted); }

        .form-input:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 245, 212, 0.04);
            box-shadow: 0 0 0 4px rgba(0, 245, 212, 0.08), 0 0 20px rgba(0, 245, 212, 0.05);
        }

        .form-input:focus ~ i,
        .form-input:focus + i { color: var(--accent-cyan); }

        .input-wrap:focus-within i { color: var(--accent-cyan); }

        .form-input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 4px var(--error-glow);
        }

        .error-text {
            color: var(--error);
            font-size: 0.78rem;
            margin-top: 0.4rem;
            display: none;
            padding-left: 4px;
        }
        .error-text.show { display: block; }

        /* 提交按钮 */
        .submit-btn {
            width: 100%;
            padding: 0.88rem;
            background: var(--gradient-btn);
            color: var(--bg-primary);
            border: none;
            border-radius: 13px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.28s ease;
            display: flex;
            align-items: center; justify-content: center;
            gap: 0.5rem;
            margin-top: 0.6rem;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before { left: 100%; }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 245, 212, 0.3), 0 0 50px rgba(0, 187, 249, 0.12);
        }

        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .submit-btn .spinner { display: none; }
        .submit-btn.loading .spinner { display: inline-block; }
        .submit-btn.loading .btn-text { display: none; }

        /* 底部链接 */
        .form-footer {
            text-align: center;
            margin-top: 1.4rem;
            font-size: 0.87rem;
            color: var(--text-muted);
        }

        .form-footer a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .form-footer a::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0; width: 0; height: 1.5px;
            background: var(--gradient-main);
            transition: width 0.25s ease;
        }

        .form-footer a:hover::after { width: 100%; }

        /* 特性标签 */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.65rem;
            margin-top: 1.6rem;
            padding-top: 1.4rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .feature-tag {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.65rem 0.75rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 11px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        .feature-tag:hover {
            background: rgba(0, 245, 212, 0.05);
            border-color: rgba(0, 245, 212, 0.12);
            color: var(--text-secondary);
        }

        .feature-tag i {
            width: 26px; height: 26px;
            background: rgba(0, 245, 212, 0.1);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem;
            color: var(--accent-cyan);
            flex-shrink: 0;
        }

        /* 管理员入口 */
        .admin-entry {
            text-align: center;
            margin-top: 1.4rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .admin-entry a {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .admin-entry a:hover { color: var(--accent-purple); }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.8rem 1.6rem;
            border-radius: 13px;
            font-size: 0.87rem;
            z-index: 9999;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: rgba(0, 245, 212, 0.3); color: var(--accent-cyan); }
        .toast.error { border-color: rgba(239, 68, 68, 0.3); color: var(--error); }

        /* 响应式 */
        @media (max-width: 480px) {
            .login-card { border-radius: 0; width: 100%; min-height: 100vh; }
            .card-header { padding: 2.2rem 1.5rem 1.4rem; }
            .card-header h1 { font-size: 1.6rem; }
            .form-panel { padding: 0 1.4rem 1.8rem; }
            .features-grid { grid-template-columns: 1fr; }
            .form-label { font-size: 0.88rem; }
            .form-input { font-size: 16px; } /* 防止 iOS 自动缩放 */
            .submit-btn { padding: 0.85rem; font-size: 1rem; }
            .form-footer { font-size: 0.85rem; text-align: center; }
        }

        /* 超小屏 (iPhone SE 等) */
        @media (max-width: 375px) {
            .card-header { padding: 1.8rem 1.2rem 1.2rem; }
            .card-header h1 { font-size: 1.4rem; }
            .form-panel { padding: 0 1.2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- 背景层 -->
    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- 登录卡片 -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="card-header">
                <div class="brand-icon"><i class="fas fa-robot"></i></div>
                <h1>EXO AI</h1>
                <p>分布式推理集群 · 安全接入</p>
            </div>

            <!-- 登录表单 -->
            <div class="form-panel" id="panelLogin">
                <form id="loginForm" onsubmit="handleEmailLogin(event)">
                    <div class="form-group">
                        <label>邮箱地址</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" class="form-input"
                                   placeholder="请输入邮箱地址" required autocomplete="email">
                        </div>
                        <div class="error-text" id="loginEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" class="form-input"
                                   placeholder="请输入密码" required minlength="6" autocomplete="current-password">
                        </div>
                        <div class="error-text" id="loginPasswordError"></div>
                    </div>

                    <button type="submit" class="submit-btn" id="loginBtn">
                        <span class="btn-text">登 录</span>
                        <span class="spinner"><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                </form>

                <div class="form-footer">
                    还没有账号？<a href="/register">立即注册</a>
                </div>
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '';

        // ==================== Toast ====================
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast show ${type}`;
            setTimeout(() => t.classList.remove('show'), 3200);
        }

        // ==================== 表单验证 ====================
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(inputId, errorId, msg) {
            document.getElementById(inputId).classList.add('error');
            const el = document.getElementById(errorId);
            el.textContent = msg;
            el.classList.add('show');
        }

        function clearError(inputId, errorId) {
            document.getElementById(inputId).classList.remove('error');
            document.getElementById(errorId).classList.remove('show');
        }

        // 清除输入时自动清除错误状态
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', function() {
                this.classList.remove('error');
                const errEl = this.parentElement.parentElement.querySelector('.error-text');
                if (errEl) errEl.classList.remove('show');
            });
        });

        // ==================== 邮箱登录 ====================
        async function handleEmailLogin(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            clearError('loginEmail', 'loginEmailError');
            clearError('loginPassword', 'loginPasswordError');

            let hasErr = false;
            if (!email) { showError('loginEmail', 'loginEmailError', '请输入邮箱地址'); hasErr = true; }
            else if (!validateEmail(email)) { showError('loginEmail', 'loginEmailError', '邮箱格式不正确'); hasErr = true; }
            if (!password) { showError('loginPassword', 'loginPasswordError', '请输入密码'); hasErr = true; }
            else if (password.length < 6) { showError('loginPassword', 'loginPasswordError', '密码长度至少6位'); hasErr = true; }
            if (hasErr) return;

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/login/email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('登录成功！正在跳转...', 'success');
                    setTimeout(() => window.location.href = '/user/dashboard', 800);
                } else {
                    const detail = data.detail || '登录失败';
                    showToast(detail, 'error');
                    if (detail.includes('邮箱')) showError('loginEmail', 'loginEmailError', detail);
                    else showError('loginPassword', 'loginPasswordError', detail);
                }
            } catch (err) {
                showToast('网络错误，请重试', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
